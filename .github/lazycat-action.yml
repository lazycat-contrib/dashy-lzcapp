version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: dashy
build:
  toolchains: []
  run_buildscript: false
images:
  - id: dashy
    target: service
    service: dashy
    source: ghcr.io/lissy93/dashy
    channel: stable
    sort: semver
    tag_regex: '^\d+\.\d+\.\d+$'
    delivery:
      mode: mirror
      require_digest_match: true
release:
  use_github_release_notes: true
  store_changelog_format: plain
stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Dashy
    summary: 可视化编辑的导航与服务仪表盘
